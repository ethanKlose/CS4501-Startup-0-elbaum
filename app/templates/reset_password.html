{% extends "base.html" %}
{% block content %}
<section class="card empty"><h1>Choose a new password</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="btn primary">Save new password</button></form>
<a href="/forgot-password">Request a new link</a></section>
{% endblock %}
