{% extends "base.html" %}
{% block content %}
<section class="card empty"><h1>Reset your password</h1>
{% if sent %}<p role="status">If that account exists, password reset instructions have been sent. For a local demo without SMTP, check the private .local-mail folder on the server.</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" required></label><button class="btn primary">Send reset link</button></form>
<a href="/login">Back to login</a></section>
{% endblock %}
