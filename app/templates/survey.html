{% extends "base.html" %}
{% block title %}Survey · PlateJoy{% endblock %}
{% block content %}
<h1>Your survey</h1>
{% if saved %}<p class="ok" role="status">Saved.</p>{% endif %}
<form method="post" class="card" style="max-width:640px">
  <fieldset>
    <legend>Budget</legend>
    <label>Weekly grocery budget ($)
      <input type="number" name="budget" step="0.01" min="0.01" required
             value="{{ form.budget if form is defined else (profile.budget if profile.budget is not none else '') }}">
    </label>
    {% if errors.budget %}<p class="error" role="alert">{{ errors.budget }}</p>{% endif %}
  </fieldset>
  <button>Save</button>
</form>
{% endblock %}
