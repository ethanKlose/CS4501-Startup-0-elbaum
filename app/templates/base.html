<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlateJoy{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">PlateJoy <small>alpha</small></a>
  <nav>
    {% if user %}
      <a href="/">Plan</a>
      <a href="/grocery">Grocery</a>
      <a href="/checkin">Check-in</a>
      <a href="/survey">Survey</a>
      <form method="post" action="/logout" class="inline"><button class="link">Log out ({{ user.email }})</button></form>
    {% else %}
      <a href="/login">Log in</a> <a href="/register">Sign up</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
