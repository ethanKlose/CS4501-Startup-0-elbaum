name: CI
on:
  push: { branches: [main, alpha-mvp, KS_Work] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m coverage run --source=app -m pytest -q --strict-markers --junitxml=test-results/python-suite.xml
      - run: python -m coverage report --fail-under=90
      - run: mkdir -p test-results
      - run: python -m coverage json -o test-results/python-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            test-results/python-coverage.json
            test-results/python-suite.xml

  integration:
    name: Integration (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/integration -m integration -q --strict-markers --junitxml=test-results/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/integration.xml

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PYTHON: python
      - run: npm run test:e2e:audit
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
